<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/logo.png" />
    <meta name="theme-color" content="#14224f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>%VITE_BRAND_NAME% | Kids Wear, Karachi</title>
    <meta data-rh="true" name="description" content="%VITE_TAGLINE%. Shop online and order on WhatsApp." />
    <!--
      These static tags are what WhatsApp / Facebook show when someone shares a link,
      because their link-preview bots do not run JavaScript.
      Replace public/og-image.jpg with a 1200x630 picture of your brand.
    -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="%VITE_BRAND_NAME%" />
    <meta data-rh="true" property="og:title" content="%VITE_BRAND_NAME%" />
    <meta data-rh="true" property="og:description" content="%VITE_TAGLINE%. Shop online and order on WhatsApp." />
    <meta data-rh="true" property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
